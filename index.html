<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>YOUNG. — ARCHITECT</title>
  <meta name="description" content="Architecture portfolio" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Global Chrome: YOUNG. + hamburger menu -->
  <header class="chrome" id="chrome">
    <a href="#/" class="chrome__brand" data-nav="home">YOUNG.</a>
    <button class="chrome__menu" data-nav="menu" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- HOME VIEW -->
  <section class="view view--home" data-view="home" id="viewHome">
    <div class="home__content">
      <h1 class="home__brand">YOUNG.</h1>
      <p class="home__subtitle">ARCHITECT</p>
      <span class="home__hint">Click to enter menu <span class="home__hint__arrow">&rarr;</span></span>
    </div>
  </section>

  <!-- MENU VIEW -->
  <section class="view view--menu" data-view="menu" id="viewMenu">
    <nav class="menu__nav">
      <a href="#/projects" class="menu__item" data-index="01">
        <span class="menu__number">01</span>
        <span class="menu__text">Project</span>
      </a>
      <a href="#/others" class="menu__item" data-index="02">
        <span class="menu__number">02</span>
        <span class="menu__text">Others</span>
      </a>
      <a href="#/contact" class="menu__item" data-index="03">
        <span class="menu__number">03</span>
        <span class="menu__text">Contact me</span>
      </a>
    </nav>
  </section>

  <!-- PROJECT LIST VIEW -->
  <section class="view view--projects" data-view="projects" id="viewProjects">
    <header class="page-header">
      <span class="page-header__label">Project</span>
      <span class="page-header__count" id="projectCount">2 works</span>
    </header>
    <div class="project-list" id="projectList">
      <!-- Project cards injected by JS -->
    </div>
    <div class="pager-controls" id="pagerControls">
      <button class="pager-btn pager-btn--prev" id="pagerPrev" aria-label="Previous project">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="pager-counter">
        <span id="pagerCurrent">01</span>
        <span class="pager-counter__sep">/</span>
        <span id="pagerTotal">06</span>
      </span>
      <button class="pager-btn pager-btn--next" id="pagerNext" aria-label="Next project">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </section>

  <!-- PROJECT DETAIL VIEW — one project at a time, pure imagery -->
  <section class="view view--detail" data-view="detail" id="viewDetail">
    <div class="detail-track" id="detailTrack">
      <!-- Slides injected by JS -->
    </div>
    <button class="detail-back" id="detailBack" aria-label="Back to project index">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      <span>Projects</span>
    </button>
    <div class="detail-progress" id="detailProgress"><!-- dots injected by JS --></div>
  </section>

  <!-- OTHERS VIEW -->
  <section class="view view--others" data-view="others" id="viewOthers">
    <header class="page-header">
      <span class="page-header__label">Others</span>
    </header>
    <div class="placeholder-content">
      <p>Coming soon</p>
      <p class="placeholder-sub">Sketches, writings, experiments</p>
    </div>
  </section>

  <!-- CONTACT VIEW -->
  <section class="view view--contact" data-view="contact" id="viewContact">
    <header class="page-header">
      <span class="page-header__label">Contact me</span>
    </header>
    <div class="contact-content">
      <h2 class="contact-name">WUFAN YANG</h2>
      <a href="mailto:19962511017@163.com" class="contact-link">19962511017@163.com</a>
      <p class="contact-sub">Available for opportunities</p>
    </div>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
